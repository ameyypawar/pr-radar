server:
  issuer: "https://concentration-editorials-discounted-award.trycloudflare.com"
  address: ":9000"
  allowed_origins:
    - "*"

storage:
  driver: sqlite
  sqlite:
    path: "/data/authserver.db"
    wal: true

signing:
  algorithm: ES256
  key_path: "/data/keys"

session:
  secure: true
  secret: "${AUTHPLANE_SESSION_SECRET}"

dcr:
  mode: open

admin:
  enabled: true
  address: ":9001"
  api_key: "${AUTHPLANE_ADMIN_API_KEY}"

client_credentials:
  enabled: true
token_exchange:
  enabled: true
  max_chain_depth: 5
  token_expiry: 1h

# Claude's CIMD document advertises the jwt-bearer grant; authplane refuses to
# register a client that names any disabled grant, so this must be on for the
# Claude connector to complete authorization.
xaa:
  enabled: true

# Broker grants (upstream refresh tokens) are encrypted at rest; without a
# driver configured the connect/broker subsystem stays disabled.
data_encryption:
  driver: aes_master
  aes_master:
    key_env: AUTHPLANE_DATA_ENC_KEY

connect:
  state_secret: "${AUTHPLANE_CONNECT_STATE_SECRET}"
  redirect_base_url: "https://concentration-editorials-discounted-award.trycloudflare.com"
  allowed_return_urls:
    - "https://cyan-schools-roll-396.alpic.dev"
    - "https://cyan-schools-roll-396.alpic.dev/mcp"
