server:
  issuer: "https://concentration-editorials-discounted-award.trycloudflare.com"
  address: ":9000"
  allowed_origins:
    - "*"

storage:
  driver: sqlite
  sqlite:
    path: "/data/authserver.db"
    wal: true

signing:
  algorithm: ES256
  key_path: "/data/keys"

session:
  secure: true
  secret: "${AUTHPLANE_SESSION_SECRET}"

dcr:
  mode: open

admin:
  enabled: true
  address: ":9001"
  api_key: "${AUTHPLANE_ADMIN_API_KEY}"

client_credentials:
  enabled: true
token_exchange:
  enabled: true
  max_chain_depth: 5
  token_expiry: 1h
