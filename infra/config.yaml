# server.issuer and server.allowed_origins are deployment-specific (this
# project's public URL is a Cloudflare quick-tunnel hostname that changes
# on every restart) so neither is hardcoded here — see issues #19 and #63.
# Both have real AUTHPLANE_* overrides, applied after this file loads:
# AUTHPLANE_SERVER_ISSUER and AUTHPLANE_SERVER_ALLOWED_ORIGINS (comma-
# separated), set in infra/.secrets.env. Left unset here and in the
# environment, issuer falls back to AuthPlane's http://localhost:9000
# default and allowed_origins falls back to empty (no CORS; browser MCP
# clients then fail preflight — logged as a startup WARN, not a boot
# failure).
server:
  address: ":9000"

storage:
  driver: sqlite
  sqlite:
    path: "/data/authserver.db"
    wal: true

signing:
  algorithm: ES256
  key_path: "/data/keys"

session:
  secure: true
  secret: "${AUTHPLANE_SESSION_SECRET}"

dcr:
  mode: open

admin:
  enabled: true
  address: ":9001"
  api_key: "${AUTHPLANE_ADMIN_API_KEY}"

client_credentials:
  enabled: true
token_exchange:
  enabled: true
  max_chain_depth: 5
  token_expiry: 1h

# Claude's CIMD document advertises the jwt-bearer grant; authplane refuses to
# register a client that names any disabled grant, so this must be on for the
# Claude connector to complete authorization.
xaa:
  enabled: true

# Broker grants (upstream refresh tokens) are encrypted at rest; without a
# driver configured the connect/broker subsystem stays disabled.
data_encryption:
  driver: aes_master
  aes_master:
    key_env: AUTHPLANE_DATA_ENC_KEY

# connect.redirect_base_url and connect.allowed_return_urls: same
# deployment-specific-hostname problem as server.issuer/allowed_origins
# above, same fix — set via AUTHPLANE_CONNECT_REDIRECT_BASE_URL and
# AUTHPLANE_CONNECT_ALLOWED_RETURN_URLS (comma-separated) in
# infra/.secrets.env. Both optional at the AuthPlane level; leaving them
# unset disables the upstream-connect redirect surface rather than
# failing boot — see docs/guides/deploy/configuration.md.
connect:
  state_secret: "${AUTHPLANE_CONNECT_STATE_SECRET}"
